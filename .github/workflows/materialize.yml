name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish gh-pages and enable Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          {
            echo "HEAD $(git rev-parse HEAD)"
            git status --short
            git push origin HEAD:gh-pages
            echo "push_pages:$?"
            body='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d "${body}")
            echo "pages_create:${code}"
            cat /tmp/pages.json
            echo
            if [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
              code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
                -d "${body}")
              echo "pages_update:${code}"
              cat /tmp/pages.json
              echo
            fi
            curl -sS -o /tmp/topics.json -w "topics:%{http_code}\n" -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
              -d '{"names":["midi","psybient","music-production","composition","ambient"]}'
            cat /tmp/topics.json
            echo
          } > docs/pages-enable-log.txt 2>&1
          git add docs/pages-enable-log.txt
          git commit -m "Pages API result [skip ci]"
          git push origin HEAD:main
          echo "push_main:$?"
