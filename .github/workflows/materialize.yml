name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack generator
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --max-time 120 -o source.tar.gz "https://d.uguu.se/adXvMvAy.tar.gz"
          echo "f8a7a36a2662edce3409df3b1e22811b44410a81ea1111de4c85e65f881518a9  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Publish the pack
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Psybient [skip ci]"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages
