name: materialize

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'duration-text-once') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack generator
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --max-time 120 -o source.tar.gz "https://d.uguu.se/nytQcDzq.tar.gz"
          echo "2c22320c15866eb649a3b40f399d98766d9ea89e43412dc386740f2e4ea10ec3  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          touch .nojekyll
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Build pack
        run: python3 tools/build_pack.py
      - name: Publish the pack
        run: |
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Materialize Psybient [skip ci]"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages

  duration-text:
    if: ${{ contains(github.event.head_commit.message, 'duration-text-once') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: State the encoded MP3 as 23.415 seconds
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git show origin/gh-pages:index.html > index.html
          python3 - << 'PY'
          import base64
          from pathlib import Path
          index = Path("index.html")
          text = index.read_text()
          old = "The encoded MP3 is 23.41 seconds."
          new = "The encoded MP3 is 23.415 seconds."
          if text.count(old) != 1:
              raise SystemExit("index duration sentence missing")
          text = text.replace(old, new, 1)
          if "PLACEHOLDER" in text or "23.458" in text:
              raise SystemExit("bad index")
          if "The film is 23.41 seconds" not in text:
              raise SystemExit("film sentence missing")
          if "No human listening audition was performed for this build." not in text:
              raise SystemExit("audition sentence missing")
          if "preview, not a master" not in text or "preview, not master" not in text:
              raise SystemExit("preview disclosure missing")
          index.write_text(text)
          media = Path("media.html")
          mt = media.read_text()
          a = "the MP3 is 23.41 seconds."
          b = "the MP3 is 23.415 seconds."
          c = "\u00b7 23.41 seconds \u00b7"
          d = "\u00b7 23.415 seconds \u00b7"
          if mt.count(a) != 1 or mt.count(c) != 1:
              raise SystemExit("media duration count")
          mt = mt.replace(a, b, 1).replace(c, d, 1)
          if "the film is 23.41 seconds" not in mt:
              raise SystemExit("film media sentence missing")
          if "23.458" in mt or "PLACEHOLDER" in mt:
              raise SystemExit("bad media")
          if "No human listening audition was performed for this build." not in mt:
              raise SystemExit("media audition missing")
          media.write_text(mt)
          page = Path("tools/page.py")
          pg = page.read_text()
          olds = "seconds = f\"{preview['seconds_encoded']:.2f}\""
          news = "seconds = f\"{preview['seconds_encoded']:.3f}\""
          if pg.count(olds) != 1:
              raise SystemExit("page format missing")
          pg = pg.replace(olds, news, 1)
          if "film_seconds = f\"{film['duration_seconds']:.2f}\"" not in pg:
              raise SystemExit("film format changed")
          page.write_text(pg)
          screen = Path("tools/screening.py")
          sc = screen.read_text()
          olds = "preview_seconds = f\"{config['preview_seconds']:.2f}\""
          news = "preview_seconds = f\"{config['preview_seconds']:.3f}\""
          if sc.count(olds) != 1:
              raise SystemExit("screening format missing")
          sc = sc.replace(olds, news, 1)
          if "film_seconds = f\"{config['film_seconds']:.2f}\"" not in sc:
              raise SystemExit("screening film format changed")
          screen.write_text(sc)
          original = base64.b64decode("")
          Path(".github/workflows/materialize.yml").write_bytes(original)
          PY

          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add index.html media.html tools/page.py tools/screening.py .github/workflows/materialize.yml
          git diff --cached --name-only
          git commit -m "State the catalog preview as 23.415 seconds [skip ci]"
          git push origin HEAD:main
          git push origin HEAD:gh-pages
